<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Gasto</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        .navbar {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            padding: 20px 40px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
            font-size: 22px;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .info-box {
            background: #eff6ff;
            color: #1e40af;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .acciones {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .btn-guardar {
            flex: 1;
            background: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancelar {
            flex: 1;
            background: transparent;
            color: #6b7280;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            box-sizing: border-box;
        }

        .btn-guardar:hover {
            background: #1d4ed8;
        }

        .btn-cancelar:hover {
            background: #f3f4f6;
        }
        /* Tablet */
        @media (max-width: 1024px) {

            .container {
                width: calc(100% - 40px);
                margin: 35px auto;
                padding: 0;
            }

            .card {
                padding: 28px;
            }
        }

        /* Móvil */
        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                align-items: flex-start;
                padding: 20px;
                gap: 15px;
            }

            .nav-links {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }

            .nav-links a {
                margin-left: 0;
            }

            .container {
                width: calc(100% - 30px);
                margin: 20px auto;
                padding: 0;
            }

            .card {
                padding: 22px;
                border-radius: 12px;
            }

            h2 {
                font-size: 22px;
            }

            .info-box {
                font-size: 13px;
                padding: 12px;
            }

            input,
            select,
            textarea,
            .btn-guardar,
            .btn-cancelar {
                font-size: 16px;
            }

            .acciones {
                flex-direction: column;
                width: 100%;
            }
            .btn-guardar,
            .btn-cancelar {
                width: 100%;
                font-size: 16px;
            }            
        }

        /* Pantallas pequeñas */
        @media (max-width: 480px) {

            .navbar h1 {
                font-size: 18px;
            }

            .container {
                width: calc(100% - 20px);
                margin: 15px auto;
            }

            .card {
                padding: 18px;
            }

            h2 {
                font-size: 20px;
            }

            label {
                font-size: 14px;
            }

            input,
            select,
            textarea {
                padding: 11px;
            }

            .btn-guardar,
            .btn-cancelar {
                padding: 13px;
                font-size: 15px;
            }
        }
        .mobile-nav {
            display: none;
        }

        @media (max-width: 768px) {

            .navbar {
                display: none;
            }

            body {
                padding-bottom: 80px;
            }

            .mobile-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: white;
                border-top: 1px solid #e5e7eb;
                box-shadow: 0 -4px 14px rgba(0,0,0,0.08);
                justify-content: space-around;
                align-items: center;
                padding: 10px 0;
                z-index: 1000;
            }

            .mobile-nav a {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-decoration: none;
                color: #6b7280;
                font-size: 22px;
                font-weight: bold;
            }

            .mobile-nav a span {
                font-size: 11px;
                margin-top: 4px;
            }

            .mobile-nav a:hover {
                color: #2563eb;
            }
            .mobile-nav a.active {
                color: #2563eb;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <h1>Control de Gastos</h1>

    <div class="nav-links">
        <a href="/dashboard-view">Dashboard</a>
        <a href="/registrar-gasto">Registrar</a>
        <a href="/gastos-view">Gastos</a>
        <a href="/historial">Historial</a>
    </div>
</div>

<div class="mobile-nav">
    <a href="/dashboard-view">📊<span>Inicio</span></a>
    <a href="/registrar-gasto">➕<span>Registrar</span></a>
    <a href="/gastos-view">💳<span>Gastos</span></a>
    <a href="/historial">🕒<span>Historial</span></a>
</div>

<div class="container">

    <div class="card">

        <h2>Editar Gasto</h2>

        <div class="info-box">
            Los cambios realizados quedarán registrados automáticamente en el historial.
        </div>

        <form method="POST">

            <label>Monto</label>
            <input type="number" step="0.01" name="monto" value="{{ gasto.monto }}" required>

            <label>Categoría</label>
            <select name="categoria" required>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id_categoria }}"
                        {% if categoria.id_categoria == gasto.id_categoria %}selected{% endif %}>
                        {{ categoria.nombre_categoria }}
                    </option>
                {% endfor %}
            </select>

            <label>Fecha</label>
            <input type="datetime-local" name="fecha" value="{{ gasto.fecha }}" required>

            <label>Notas</label>
            <textarea name="notas">{{ gasto.notas }}</textarea>

            <div class="acciones">
                <button class="btn-guardar" type="submit">
                    Guardar Cambios
                </button>

                <a class="btn-cancelar" href="/gastos-view">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
