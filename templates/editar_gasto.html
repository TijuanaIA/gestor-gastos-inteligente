<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Gasto</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        .navbar {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            padding: 20px 40px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
            font-size: 22px;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .info-box {
            background: #eff6ff;
            color: #1e40af;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .acciones {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .btn-guardar {
            flex: 1;
            background: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancelar {
            flex: 1;
            background: transparent;
            color: #6b7280;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            box-sizing: border-box;
        }

        .btn-guardar:hover {
            background: #1d4ed8;
        }

        .btn-cancelar:hover {
            background: #f3f4f6;
        }
    </style>
</head>
<body>

<div class="navbar">
    <h1>Control de Gastos</h1>

    <div class="nav-links">
        <a href="/dashboard-view">Dashboard</a>
        <a href="/registrar-gasto">Registrar</a>
        <a href="/gastos-view">Gastos</a>
        <a href="/historial">Historial</a>
    </div>
</div>

<div class="container">

    <div class="card">

        <h2>Editar Gasto</h2>

        <div class="info-box">
            Los cambios realizados quedarán registrados automáticamente en el historial.
        </div>

        <form method="POST">

            <label>Monto</label>
            <input type="number" step="0.01" name="monto" value="{{ gasto.monto }}" required>

            <label>Categoría</label>
            <select name="categoria" required>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id_categoria }}"
                        {% if categoria.id_categoria == gasto.id_categoria %}selected{% endif %}>
                        {{ categoria.nombre_categoria }}
                    </option>
                {% endfor %}
            </select>

            <label>Fecha</label>
            <input type="datetime-local" name="fecha" value="{{ gasto.fecha }}" required>

            <label>Notas</label>
            <textarea name="notas">{{ gasto.notas }}</textarea>

            <div class="acciones">
                <button class="btn-guardar" type="submit">
                    Guardar Cambios
                </button>

                <a class="btn-cancelar" href="/gastos-view">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
